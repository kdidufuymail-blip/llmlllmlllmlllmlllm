    const config=()=>state.configs[key()]||{goal:current().goal,instructions:current().steps.map((x,i)=>`${i+1}. ${x}`).join('\n'),model:agent()[2]};

    function sidebar(){const nav=[['home','Главная','home'],['workforces','Команды','users'],['agents','Агенты','bot'],['tools','Инструменты','tools'],['tasks','Задачи','tasks'],['knowledge','База знаний','book'],['integrations','Интеграции','link'],['activity','Активность','activity'],['settings','Настройки','settings']];return `<div class="brand"><span class="brandmark" aria-hidden="true"></span>FORMA AI</div><nav class="nav-group" aria-label="Основные разделы">${nav.map(([id,n,i])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(i)}${n}${id==='workforces'?'<span class="badge">5</span>':''}</button>`).join('')}</nav><div class="projects"><div class="sidebar-divider"></div><div class="spread nav-head"><span>Проекты</span><button data-action="new-project" aria-label="Создать проект">${icon('plus')}</button></div><button class="project-link" data-page="projects">${icon('folder')}Все проекты</button>${state.projects.map(([n,t,s])=>`<button class="project-link ${state.project===n&&state.page==='workforces'?'active':''}" data-project="${escapeHtml(n)}" data-team="${t}">${icon('file')}${escapeHtml(n)}<span class="project-dot ${s}"></span></button>`).join('')}</div><div class="sidebar-foot"><div class="avatar">D</div><div><strong class="small">Моя студия</strong><small>Дизайн-концепция</small></div></div>`}
    function searchResults(){const q=state.search.trim().toLowerCase();if(!q)return '';const matches=state.projects.filter(([n])=>n.toLowerCase().includes(q));return `<div class="search-results" role="listbox" aria-label="Результаты поиска">${matches.length?matches.map(([n,t])=>`<button data-project="${escapeHtml(n)}" data-team="${t}">${icon('file')}${escapeHtml(n)}</button>`).join(''):'<p>Проекты не найдены</p>'}</div>`}
    function topbar(){return `<div class="menu-wrap"><button class="top-select project" data-menu="projects">${icon('file')}<span class="truncate">${escapeHtml(state.project)}</span>${icon('chev')}</button>${state.menu==='projects'?`<div class="dropdown">${state.projects.map(([n,t])=>`<button data-project="${escapeHtml(n)}" data-team="${t}">${icon('file')}${n}</button>`).join('')}<button data-action="new-project">${icon('plus')}Новый проект</button></div>`:''}</div><button class="top-select status" data-action="status"><span class="dot ${state.status==='running'?'orange':''}"></span>${state.status==='running'?'Выполняется':state.status==='paused'?'Приостановлено':state.status==='error'?'Нужно решение':'Готово'}${icon('chev')}</button><div class="search-wrap"><label class="top-search">${icon('search')}<span class="sr">Поиск</span><input id="search" placeholder="Поиск по проектам, агентам, файлам…" value="${escapeHtml(state.search)}"><span class="shortcut">⌘ K</span></label>${searchResults()}</div><div class="top-actions"><div class="mode-switch" role="group" aria-label="Режим интерфейса"><button class="${state.mode==='simple'?'active':''}" data-mode="simple" aria-pressed="${state.mode==='simple'}">Простой</button><button class="${state.mode==='pro'?'active':''}" data-mode="pro" aria-pressed="${state.mode==='pro'}">Расширенный</button></div><button class="primary" data-action="run-team">${icon(state.status==='running'?'pause':'play')}${state.status==='running'?'Пауза':'Запустить команду'}</button><button class="icon-btn" data-action="show-result" aria-label="Показать результат">${icon('monitor')}</button><button class="icon-btn" data-action="notifications" aria-label="Уведомления">${icon('bell')}<span class="notice"></span></button><div class="avatar" style="width:30px;height:30px;background:#eff0f5;color:#59647d">D</div></div>`}

    function agentPanel(){const a=agent(),c=config();return `<section class="agent-panel ${state.mobilePanel==='agent'?'current':''}" aria-label="Настройки агента"><header class="agent-head"><span class="agent-portrait">${icon(a[3])}</span><div><div class="row"><h1>${a[0]}</h1><span class="running"><span class="dot"></span>${state.status==='running'?'Running':state.status==='ready'?'Ready':'Waiting'}</span></div><p>${a[1]}</p></div></header><label class="field"><span>Цель</span><textarea class="goal-area" data-config="goal">${escapeHtml(c.goal)}</textarea></label><label class="field"><span>Инструкции</span><textarea class="instructions-area" data-config="instructions">${escapeHtml(c.instructions)}</textarea></label><label class="field"><span>Модель</span><select data-config="model">${['Автоматически','GPT','Claude','Grok','Gemini','Kimi','Qwen','Music AI'].map(m=>`<option ${c.model===m?'selected':''}>${m}</option>`).join('')}</select></label><div class="field"><span class="section-label">Инструменты</span><div class="chips">${current().tools.map(t=>`<button class="chip ${state.tools.includes(t)?'on':''}" data-tool="${t}" aria-pressed="${state.tools.includes(t)}">${icon('check')}${t}</button>`).join('')}<button class="chip add" data-action="add-tool">${icon('plus')}Добавить</button></div></div><div class="field"><span class="section-label">Память проекта</span><div class="switch-row"><button class="switch ${state.memory?'on':''}" data-action="memory" role="switch" aria-checked="${state.memory}" aria-label="Использовать контекст проекта"></button>Использовать контекст проекта и предыдущие запуски</div></div><label class="field"><span>Задача для агента</span><span class="task-input"><input id="agent-task" placeholder="Введите задачу для запуска…" value="${escapeHtml(state.task)}"><button type="button" data-action="send-task" aria-label="Передать задачу">${icon('send')}</button></span></label><button class="run-agent" data-action="run-agent">${icon('play')}Запустить аге     document.addEventListener('input',e=>{const el=e.target;if(el.dataset.config){state.configs[key()]={...config(),[el.dataset.config]:el.value};save()}else if(el.id==='agent-task'||el.id==='simple-task'){state.task=el.value;save()}else if(el.id==='search'){state.search=el.value;const q=el.value.trim().toLowerCase();const wrap=document.querySelector('.search-wrap');wrap?.querySelector('.search-results')?.remove();if(q)wrap?.insertAdjacentHTML('beforeend',searchResults());save()}});
    document.addEventListener('change',e=>{if(e.target.dataset.config){state.configs[key()]={...config(),[e.target.dataset.config]:e.target.value};save()}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(state.showResult){state.showResult=false;render()}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#search')?.focus()}});
    render();
  </script>
</body>
</html>
